<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>R Markdown & Leaflet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: 'Helvetica Neue', Arial, sans-serif; background:#f5f5f5; margin:0; }
.slide { background:white; max-width:860px; margin:30px auto; padding:40px 50px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
h1 { color:#2c3e50; border-bottom:3px solid #27ae60; padding-bottom:10px; }
.date { color:#7f8c8d; font-size:0.9em; }
#map { width:760px; height:500px; }
</style>
</head>
<body>
<div class="slide">
<h1>My Favorite Cities</h1>
<p class="date">Created: October 06, 2026</p>
<p>This page was built with R Markdown and features an interactive Leaflet map marking a few cities I find most interesting, with popups showing why.</p>
<div id="map"></div>
</div>
<script>
var map = L.map('map').setView([48.85, 9.2], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
var cities = [
 {name:'Lisbon', lat:38.72, lon:-9.14, why:'Ocean light and pastel streets.'},
 {name:'Berlin', lat:52.52, lon:13.40, why:'History layered on every block.'},
 {name:'Bologna', lat:44.49, lon:11.34, why:'Food, porticoes, and towers.'},
 {name:'Edinburgh', lat:55.95, lon:-3.19, why:'Castle rock and bookshops.'},
 {name:'São Paulo', lat:-23.55, lon:-46.63, why:'Endless food and culture.'}
];
cities.forEach(c => {
 L.marker([c.lat, c.lon]).addTo(map).bindPopup('<b>'+c.name+'</b><br>'+c.why);
});
</script>
</body>
</html>
